<!DOCTYPE html>
<!-- Source for assets/readme-banner.png (1280×400 at 2x). Regenerate with
     tools/render-og.sh. Also the organisation profile banner in
     PromptDecode/.github: copy it there when it changes. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<link rel="stylesheet" href="render-common.css">
<style>
  .frame { width: 1280px; height: 400px; }
  .content { position: absolute; inset: 0; padding: 52px 64px; display: grid; grid-template-rows: auto 1fr auto; }
  .wm { font-size: 76px; }
  .chip { font-size: 13px; padding: 6px 11px; align-self: flex-start; }
  .sub { margin: 0; font-size: 24px; line-height: 1.35; color: var(--muted); max-width: 30ch; letter-spacing: -.01em; }
  .mid { display: flex; align-items: center; }
  .bottom { display: flex; justify-content: space-between; align-items: center; font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: .04em; color: var(--muted); }
  .rule { height: 4px; }
</style></head><body>
<div class="frame">
  <div class="glow"></div><div class="grid"></div>
  <div class="content">
    <div class="wm"><span>p</span><span>r</span><span>o</span><span>m</span><span>p</span><span>t</span><span>d</span><span class="box">e</span><span class="box">c</span><span class="box">o</span><span class="de">d</span><span class="de">e</span></div>
    <div class="mid"><p class="sub">Hidden text in a pull request can instruct your agent to approve it.</p></div>
    <div class="bottom">
      <span>promptdeco.de</span>
       <span class="chip">The decoder works · the config scanner runs from source</span>
    </div>
  </div>
  <div class="rule"></div>
</div>
</body></html>
